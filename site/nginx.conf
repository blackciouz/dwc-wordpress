server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pas de cache client/proxy sur le HTML (contenu changeant)
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }
    # CSS/JS: revalider à chaque fois (pas de cache agressif)
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    # Images/SVG/fonts: cache court
    location ~* \.(png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
