<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Digital World Coaching — DW">
  <defs>
    <linearGradient id="dwcRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="dwcLetters" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="dwcGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dwcGlowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond transparent : cercle dégradé or -> violet, bord intérieur sombre -->
  <circle cx="256" cy="256" r="238" fill="url(#dwcRing)"/>
  <circle cx="256" cy="256" r="206" fill="#0a0812"/>

  <!-- Anneau fin de soulignement -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3"/>

  <!-- Éclat subtil en haut à gauche -->
  <ellipse cx="180" cy="150" rx="120" ry="70" fill="rgba(255,255,255,0.06)" transform="rotate(-32 180 150)"/>

  <!-- Monogramme DW -->
  <g filter="url(#dwcGlowSoft)">
    <text x="256" y="330" font-family="'Space Grotesk','Inter',Arial,sans-serif" font-size="176" font-weight="800" letter-spacing="-6" text-anchor="middle" fill="url(#dwcLetters)">DW</text>
  </g>

  <!-- Point d'accent sous le monogramme -->
  <circle cx="256" cy="382" r="9" fill="#f59e0b" filter="url(#dwcGlow)"/>
</svg>