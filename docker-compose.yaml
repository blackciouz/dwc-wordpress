services:
  web:
    image: 'nginx:1.27-alpine'
    volumes:
      - './site:/usr/share/nginx/html:ro'
      - './site/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
    networks:
      - dwc-net
    labels:
      - 'coolify.proxy.fqdn=https://digitalworldcoaching.clonesxstudio.com'
      - 'coolify.proxy.port=80'
networks:
  dwc-net: {}
